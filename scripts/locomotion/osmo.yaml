# One independent Duck SAC or SuperMimic trial per GPU, from a published immutable Git commit.
version: 2
workflow:
  name: {{ workflow_name }}
  resources:
    default:
      gpu: 1
      cpu: 8
      memory: 64Gi
      storage: 96Gi
      platform: {{ platform }}
  timeout:
    exec_timeout: 60m
    queue_timeout: 30m
  tasks:
  - name: train
    lead: true
    image: {{ image }}
    {% if image_credential %}
    credentials:
      {{ image_credential }}: nvcr.io
    {% endif %}
    command: [bash]
    args: [/tmp/microduck-trial.sh, "{{output}}"]
    environment:
      ACCEPT_EULA: Y
      OMNI_KIT_ACCEPT_EULA: "YES"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      TUTORIAL_SOURCE_REPOSITORY: "{{ source_repository }}"
      TUTORIAL_SOURCE_REVISION: "{{ source_revision }}"
    files:
    - path: /tmp/microduck-trial.sh
      contents: |
        set -euo pipefail
        OUT="${1:?OSMO output directory required}"
        INPUT=/osmo/run/workspace/microduck-input
        ROOT=/osmo/run/workspace/microduck-tutorial
        mkdir -p "$OUT" "$ROOT" "$INPUT"
        finish() {
          result=$?
          trap - EXIT
          set +e
          if [[ -n "${telemetry_pid:-}" ]]; then kill "$telemetry_pid"; wait "$telemetry_pid" 2>/dev/null; fi
          printf '{"exit_code":%d}\n' "$result" > "$OUT/exit-status.json"
          touch "$OUT/trial-finished"
          mkdir -p "$OUT/collection"
          latest=$(ls "$OUT"/logs/rsl_rl/*/*/model_*.pt 2>/dev/null | sort -V | tail -n 1)
          if [[ -n "$latest" ]]; then
            run_dir=$(dirname "$latest")
            cp "$latest" "$OUT/collection/"
            cp -a "$run_dir/params" "$run_dir/run.json" "$OUT/collection/"
            cp "$run_dir"/events.out.tfevents.* "$OUT/collection/"
          fi
          if [[ -d "$OUT/evaluation" ]]; then cp -a "$OUT/evaluation" "$OUT/collection/"; fi
          for name in exit-status.json source-revision.txt source.tar.gz source.sha256 device.csv gpu-samples.csv bootstrap.log training.log evaluation.log; do
            if [[ -f "$OUT/$name" ]]; then cp "$OUT/$name" "$OUT/collection/"; fi
          done
          echo "TRIAL_FINISHED: status $result; download {{output}} with osmo workflow rsync download."
          # Retain failures as well as successes for accounts without an output bucket.
          # Touch INPUT/collected through workflow exec after downloading to release the task early.
          deadline=$((SECONDS + 300))
          until [[ -f "$INPUT/collected" ]] || (( SECONDS >= deadline )); do sleep 2; done
          exit "$result"
        }
        trap finish EXIT
        if [[ ! "$TUTORIAL_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo 'A full immutable Git commit SHA is required'; exit 1
        fi
        export GIT_LFS_SKIP_SMUDGE=1
        git init "$ROOT" > "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" fetch --depth=1 -- "$TUTORIAL_SOURCE_REPOSITORY" "$TUTORIAL_SOURCE_REVISION" >> "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" checkout --detach FETCH_HEAD >> "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" rev-parse HEAD > "$OUT/source-revision.txt"
        git -C "$ROOT" archive --format=tar.gz HEAD > "$OUT/source.tar.gz"
        (cd "$OUT" && sha256sum source.tar.gz > source.sha256)
        cd "$ROOT"
        export PATH="/workspace/isaaclab/.venv/bin:/root/.local/bin:$PATH"
        unset UV_PROJECT_ENVIRONMENT VIRTUAL_ENV PYTHONPATH
        export UV_CACHE_DIR="$ROOT/.cache/uv" WARP_CACHE_PATH="$ROOT/.cache/warp"
        nvidia-smi --query-gpu=name,uuid,driver_version --format=csv > "$OUT/device.csv"
        uv sync --project environments/workflows --locked > "$OUT/bootstrap.log" 2>&1
        mkdir -p "$OUT/logs"
        ln -s "$OUT/logs" logs
        TASK=MicroDuckTutorial-Velocity-Flat
        if [[ "{{ learner }}" == supermimic ]]; then
          TASK="$TASK-SuperMimic"
          extra=(agent.algorithm.horizon={{ horizon }}
                 agent.algorithm.world_model_warmup_iterations={{ world_model_warmup }}
                 agent.algorithm.lr_decay_iterations=$(( {{ iterations }} * 2 / 5 )))
        elif [[ "{{ learner }}" == sac ]]; then
          extra=(agent.algorithm.num_updates={{ updates }}
                 agent.algorithm.schedule_updates=$(( {{ iterations }} * {{ updates }} ))
                 agent.algorithm.actor_learning_rate={{ learning_rate }}
                 agent.algorithm.critic_learning_rate={{ learning_rate }}
                 agent.algorithm.alpha_learning_rate={{ learning_rate }})
        else
          echo 'learner must be sac or supermimic'; exit 1
        fi
        # One-second samples report training GPU use; they are not allocator-level peak measurements.
        nvidia-smi --query-gpu=timestamp,uuid,memory.used,utilization.gpu --format=csv --loop=1 > "$OUT/gpu-samples.csv" &
        telemetry_pid=$!
        uv run --project environments/workflows --locked isaaclab train \
          --rl_library rsl_rl --task "$TASK" \
          --agent rsl_rl_{{ learner }}_cfg_entry_point --num_envs {{ num_envs }} \
          --max_iterations {{ iterations }} --seed {{ seed }} --run_name osmo_{{ learner }} \
          --visualizer none agent.save_interval={{ checkpoint_interval }} "${extra[@]}" \
          > "$OUT/training.log" 2>&1
        kill "$telemetry_pid" || true
        wait "$telemetry_pid" 2>/dev/null || true
        telemetry_pid=""
        uv run --project environments/workflows --locked python scripts/locomotion/evaluate.py \
          --agent {{ learner }} --checkpoint latest --seed 0 --export --output "$OUT/evaluation" \
          > "$OUT/evaluation.log" 2>&1
        touch "$OUT/training-complete"

default-values:
  workflow_name: microduck-sac-trial
  image: nvcr.io/nvidia/isaac-lab:3.0.0
  image_credential: ""
  source_repository: https://github.com/AntoineRichard/IsaacLabTutorial.git
  source_revision: 510d8e71904ae1876142ae718867377bb8f9119a
  platform: ovx-l40
  seed: 42
  num_envs: 4096
  iterations: 1500
  updates: 16
  learner: sac
  horizon: 16
  world_model_warmup: 500
  checkpoint_interval: 500
  learning_rate: 0.0003
