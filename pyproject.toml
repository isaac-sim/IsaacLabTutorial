[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "isaaclab-tutorial"
version = "0.1.0"
description = "Isaac Lab tutorial for placing a vial with an SO-101 arm"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab"]

[project.optional-dependencies]
# Standalone PhysX runtime for the `physx` physics preset and the standalone RTX renderer for the `rtx` renderer
# preset (sim-to-sim without Isaac Sim). Isaac Sim users already have both.
ovphysx = ["ovphysx"]
ovrtx = ["ovrtx==0.4.1.364340"]

[project.entry-points."isaaclab.tasks"]
so101-vial-place = "isaaclab_tutorial.tasks"

[project.scripts]
generate-so101-resets = "isaaclab_tutorial.tasks.place_vial.reset.generator:generate_main"
view-so101-resets = "isaaclab_tutorial.tasks.place_vial.reset.generator:view_main"

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
isaaclab = { git = "https://github.com/StafaH/IsaacLab.git", rev = "efbbde338f5222eb759cd67397fdc84c088f6c5c", subdirectory = "tools/wheel_builder" }
ovphysx = { index = "nvidia" }
ovrtx = { index = "nvidia" }

[tool.uv]
# Preserve the numerical stack used for the qualified Newton policies.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "mujoco~=3.11.0",
  "mujoco-warp~=3.11.0",
  "newton[sim] @ git+https://github.com/newton-physics/newton.git@2cb4cd0260d8de90f96847c04915a758b2e7cc65",
  "newton-usd-schemas>=0.4.1",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[tool.uv.build-backend]
module-name = "isaaclab_tutorial"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"
ignore-words-list = "nd"
