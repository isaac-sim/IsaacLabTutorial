# One fixed-policy mechanism sweep per GPU; no learner or training command is launched.
version: 2
workflow:
  name: {{ workflow_name }}
  resources:
    default:
      gpu: 1
      cpu: 12
      memory: 64Gi
      storage: 96Gi
      platform: {{ platform }}
  timeout:
    exec_timeout: 60m
    queue_timeout: 60m
  tasks:
  - name: evaluate
    lead: true
    image: {{ image }}
    {% if image_credential %}
    credentials:
      {{ image_credential }}: nvcr.io
    {% endif %}
    command: [bash]
    args: [/tmp/microduck-effect-sweep.sh, "{{output}}"]
    environment:
      ACCEPT_EULA: Y
      OMNI_KIT_ACCEPT_EULA: "YES"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TUTORIAL_SOURCE_REPOSITORY: "{{ source_repository }}"
      TUTORIAL_SOURCE_REVISION: "{{ source_revision }}"
      TUTORIAL_MECHANISM: "{{ mechanism }}"
      TUTORIAL_POLICY_SHA256: "{{ checkpoint_sha256 }}"
      TUTORIAL_ARCHIVE_SHA256: "{{ policy_archive_sha256 }}"
      TUTORIAL_CHECKPOINT_FILE: "{{ checkpoint_file }}"
      TUTORIAL_WORKERS: "{{ workers }}"
      TUTORIAL_SEED_COUNT: "{{ eval_seed_count }}"
      TUTORIAL_CASE: "{{ case_name }}"
    files:
    - path: /tmp/microduck-effect-sweep.sh
      contents: |
        set -euo pipefail
        OUT="${1:?OSMO output directory required}"
        INPUT=/osmo/run/workspace/microduck-input
        ROOT=/osmo/run/workspace/microduck-tutorial
        mkdir -p "$OUT/collection" "$ROOT" "$INPUT/policy"
        finish() {
          result=$?
          trap - EXIT
          set +e
          printf '{"exit_code":%d}\n' "$result" > "$OUT/collection/exit-status.json"
          for log in bootstrap.log driver.log source-fetch.log; do
            [[ ! -f "$OUT/$log" ]] || cp "$OUT/$log" "$OUT/collection/"
          done
          if [[ -f "$OUT/sweep/collection/trial-artifacts.tar.gz" ]]; then
            cp "$OUT/sweep/collection/"* "$OUT/collection/"
          else
            tar -czf "$OUT/collection/bootstrap-failure.tar.gz" -C "$OUT" --exclude=collection .
            (cd "$OUT/collection" && sha256sum bootstrap-failure.tar.gz > bootstrap-failure.sha256)
          fi
          touch "$OUT/collection/trial-finished"
          echo "SWEEP_FINISHED: status $result; collect and verify $OUT/collection."
          deadline=$((SECONDS + 1200))
          until [[ -f "$INPUT/collected" ]] || (( SECONDS >= deadline )); do sleep 2; done
          exit "$result"
        }
        trap finish EXIT
        [[ "$TUTORIAL_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Choose a full source commit SHA'; exit 1; }
        [[ "$TUTORIAL_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Choose the exact policy SHA256'; exit 1; }
        [[ "$TUTORIAL_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Choose the policy-input archive SHA256'; exit 1; }
        [[ "$TUTORIAL_SEED_COUNT" =~ ^[1-9][0-9]*$ ]] && (( TUTORIAL_SEED_COUNT <= 10 )) || exit 1
        export GIT_LFS_SKIP_SMUDGE=1
        git init "$ROOT" > "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" fetch --depth=1 -- "$TUTORIAL_SOURCE_REPOSITORY" "$TUTORIAL_SOURCE_REVISION" >> "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" checkout --detach FETCH_HEAD >> "$OUT/source-fetch.log" 2>&1
        git -C "$ROOT" archive --format=tar.gz HEAD > "$OUT/collection/source.tar.gz"
        (cd "$OUT/collection" && sha256sum source.tar.gz > source.sha256)
        cd "$ROOT"
        export PATH="/workspace/isaaclab/.venv/bin:/root/.local/bin:$PATH"
        unset UV_PROJECT_ENVIRONMENT VIRTUAL_ENV PYTHONPATH
        export UV_CACHE_DIR="$ROOT/.cache/uv" WARP_CACHE_PATH="$ROOT/.cache/warp"
        export MPLCONFIGDIR="$ROOT/.cache/matplotlib"
        nvidia-smi --query-gpu=name,uuid,driver_version --format=csv > "$OUT/collection/device.csv"
        uv sync --project environments/locomotion --locked > "$OUT/bootstrap.log" 2>&1
        echo "Upload policy-input.tar.gz, then input-ready, to $INPUT using workflow rsync upload."
        deadline=$((SECONDS + 900))
        until [[ -f "$INPUT/input-ready" ]]; do
          (( SECONDS < deadline )) || { echo 'Policy input was not supplied before the bounded deadline'; exit 1; }
          sleep 2
        done
        printf '%s  %s\n' "$TUTORIAL_ARCHIVE_SHA256" "$INPUT/policy-input.tar.gz" | sha256sum --check -
        uv run --project environments/locomotion --locked python - "$INPUT" <<'PY'
        import sys, tarfile
        from pathlib import Path
        folder = Path(sys.argv[1])
        with tarfile.open(folder / "policy-input.tar.gz") as archive:
            archive.extractall(folder / "policy", filter="data")
        PY
        eval_seeds=()
        for ((seed_index=0; seed_index<TUTORIAL_SEED_COUNT; seed_index++)); do eval_seeds+=("$seed_index"); done
        selected_case=()
        [[ -z "$TUTORIAL_CASE" ]] || selected_case=(--case "$TUTORIAL_CASE")
        uv run --project environments/locomotion --locked python scripts/locomotion/run_effect_sweep.py \
          --checkpoint "$INPUT/policy/$TUTORIAL_CHECKPOINT_FILE" --checkpoint-sha256 "$TUTORIAL_POLICY_SHA256" \
          --mechanism "$TUTORIAL_MECHANISM" --workers "$TUTORIAL_WORKERS" --seeds "${eval_seeds[@]}" \
          "${selected_case[@]}" --output "$OUT/sweep" > "$OUT/driver.log" 2>&1

default-values:
  workflow_name: microduck-effect-sweep
  image: REPLACE_WITH_YOUR_VALIDATED_IMAGE_DIGEST
  image_credential: ""
  source_repository: https://github.com/AntoineRichard/IsaacLabTutorial.git
  source_revision: REPLACE_WITH_PUBLISHED_40_CHARACTER_COMMIT
  platform: ovx-l40
  mechanism: nominal
  checkpoint_sha256: REPLACE_WITH_SELECTED_POLICY_SHA256
  policy_archive_sha256: REPLACE_WITH_INPUT_ARCHIVE_SHA256
  checkpoint_file: model_999.pt
  workers: 3
  eval_seed_count: 10
  case_name: ""
